name: Update Purview Formula
run-name: Update purview ${{ inputs.tag || 'to the newest stable release' }}

# The tap reads aberoham/ms-purview-cli's public releases and commits with its
# own token, so no other repository holds a credential that can write here.
on:
  schedule:
    # 09:57 UTC, Monday to Friday, ten minutes after the entra updater, so
    # the two do not race to push to main. Run it by hand to publish sooner.
    - cron: "57 9 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default is the newest stable release)
        required: false
        type: string
      retest:
        description: Run the install tests even if the formula is already current
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-purview-formula
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: aberoham/ms-purview-cli

jobs:
  prepare:
    name: Prepare formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.formula.outputs.changed }}
      base: ${{ steps.formula.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # The updater runs under `brew ruby` for Homebrew's Version class, so
      # each step that calls it puts Homebrew on PATH first.
      - name: Test the updater
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ruby test/update_purview_formula_test.rb

      # A named tag may move the formula to any release, which is how a bad
      # release is rolled back. The unattended default takes the newest stable
      # release and only moves up; prereleases are published only by name.
      - name: Choose release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            allow_downgrade=true
          else
            tag="$(gh release list --repo "$RELEASE_REPOSITORY" --exclude-drafts \
              --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
            allow_downgrade=false
          fi
          if [[ -z "$tag" ]]; then
            echo "No published release in ${RELEASE_REPOSITORY}"
          elif [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Refusing ${tag}: expected vX.Y.Z or vX.Y.Z-alpha.N, -beta.N or -rc.N" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "allow_downgrade=${allow_downgrade}" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/checksums-sha256.txt" \
            --output "${RUNNER_TEMP}/checksums-sha256.txt"

      - name: Update formula URLs and checksums
        id: formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALLOW_DOWNGRADE: ${{ steps.release.outputs.allow_downgrade }}
          RETEST: ${{ inputs.retest }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # Before purview's first release, main has no formula. The first
          # candidate starts from the fixture template and goes through the
          # same install matrix as any later update.
          if git cat-file -e HEAD:Formula/purview.rb 2>/dev/null; then
            base="$(git rev-parse HEAD:Formula/purview.rb)"
          else
            base=absent
            mkdir -p Formula
            cp test/fixtures/purview-0.0.1.rb Formula/purview.rb
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          flags=()
          if [[ "$ALLOW_DOWNGRADE" == true ]]; then
            flags+=(--allow-downgrade)
          fi
          brew ruby -- scripts/update-purview-formula.rb "${flags[@]}" \
            "$TAG" "$RELEASE_REPOSITORY" "${RUNNER_TEMP}/checksums-sha256.txt" \
            Formula/purview.rb
          ruby -c Formula/purview.rb
          # The updater rewrites every target block, so no placeholder from
          # the template may survive into a candidate.
          if grep -q '"0\{64\}"' Formula/purview.rb; then
            echo "Formula/purview.rb still holds a placeholder checksum" >&2
            exit 1
          fi
          # git diff sees only tracked files; a new formula is untracked.
          if [[ "$base" != absent ]]; then
            git diff --check
          fi
          # A retest sends the unchanged formula through the install matrix;
          # the publish job then finds nothing to commit.
          if [[ -z "$(git status --porcelain -- Formula/purview.rb)" && "$RETEST" != true ]]; then
            echo "Formula already publishes ${TAG}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the candidate formula
        if: steps.formula.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purview-formula
          path: Formula/purview.rb
          retention-days: 1

  test:
    name: Install on ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read # verify the archive's build provenance
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: purview-formula
          path: ${{ runner.temp }}/candidate

      # Homebrew installs formulae only from a tap, so the candidate goes into
      # a throwaway local one. The test block runs `purview version` and
      # `purview --help` and touches no Microsoft account.
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new --no-git aberoham/candidate
          cp "${RUNNER_TEMP}/candidate/purview.rb" \
            "$(brew --repository aberoham/candidate)/Formula/purview.rb"
          # Runner images carry different Homebrew releases; those with tap
          # trust may refuse an untrusted tap, and older ones lack the command.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap aberoham/candidate
          fi
          brew install --formula aberoham/candidate/purview

          # Every purview release carries a build provenance attestation from
          # its release workflow, run on the tag. Check the archive Homebrew
          # downloaded, after the formula's checksum has already matched it.
          archive="$(brew --cache --formula aberoham/candidate/purview)"
          gh attestation verify "$archive" --repo "$RELEASE_REPOSITORY" \
            --signer-workflow "${RELEASE_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${TAG}"

          if [[ "$RUNNER_OS" == macOS ]]; then
            ruby scripts/verify-macos-release.rb purview "$TAG" "$(brew --prefix)/bin/purview"
          fi
          brew test aberoham/candidate/purview
          output="$("$(brew --prefix)/bin/purview" version)"
          echo "$output"
          if [[ "$output" != "purview ${TAG#v} "* ]]; then
            echo "purview version does not report ${TAG#v}" >&2
            exit 1
          fi
          test -x "$(brew --prefix)/share/doc/purview/contrib/resign.sh"

  publish:
    name: Publish formula
    needs: [prepare, test]
    # A run dispatched from another branch may prepare and test, but only a
    # run of main's own workflow may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the updated formula to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it

      # The candidate replaces the whole file, so publishing it over a formula
      # that changed after preparation would silently discard that change.
      - name: Check main's formula is the one the candidate was built from
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:Formula/purview.rb 2>/dev/null; then
            current="$(git rev-parse HEAD:Formula/purview.rb)"
          else
            current=absent
          fi
          if [[ "$current" != "$BASE" ]]; then
            echo "Formula/purview.rb on main changed after this run prepared its candidate." >&2
            echo "Re-run the workflow to build the candidate from the current formula." >&2
            exit 1
          fi

      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: purview-formula
          path: Formula

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- Formula/purview.rb)" ]]; then
            echo "Formula already publishes ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/purview.rb
          git commit -m "Update purview to ${TAG}"
          git push origin HEAD:main
