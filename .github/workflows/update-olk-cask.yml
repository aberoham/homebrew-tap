name: Update olk Cask
run-name: Update olk ${{ inputs.tag || 'to the newest mirrored upstream release' }}

# olk: upstream's stable releases, built, signed and attested by the fork and
# published there as upstream-vX.Y.Z.
on:
  schedule:
    # 09:47 UTC, Monday to Friday, an hour and a half after the fork's mirror
    # run.
    - cron: "47 9 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Mirrored release tag to publish, upstream-vX.Y.Z (default is the newest)
        required: false
        type: string

permissions: {}

concurrency:
  group: update-olk-cask
  cancel-in-progress: false

jobs:
  cask:
    name: olk
    permissions:
      contents: write # publish the cask to main
      attestations: read # verify the archive's build provenance
    uses: ./.github/workflows/olk-cask.yml
    with:
      channel: stable
      tag: ${{ inputs.tag }}
