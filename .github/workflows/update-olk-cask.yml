name: Update olk Cask
run-name: Update olk ${{ inputs.tag || 'to the newest fork release' }}

# The tap reads the fork's public releases and commits with its own token, so
# no other repository holds a credential that can write here.
on:
  schedule:
    # 09:47 UTC, Monday to Friday. Run the workflow by hand to publish sooner.
    - cron: "47 9 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Fork prerelease tag to publish (default is the newest release)
        required: false
        type: string

permissions: {}

concurrency:
  group: update-olk-cask
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: aberoham/olkcli

jobs:
  prepare:
    name: Prepare cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.cask.outputs.changed }}
      base: ${{ steps.cask.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Test the updater
        run: ruby test/update_olk_cask_test.rb

      # A named tag may move the cask to any fork prerelease, which is how a
      # bad release is rolled back. The unattended default only moves up.
      - name: Choose release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            allow_downgrade=true
          else
            tag="$(gh release list --repo "$RELEASE_REPOSITORY" --exclude-drafts \
              --limit 1 --json tagName --jq '.[0].tagName // ""')"
            allow_downgrade=false
          fi
          if [[ -z "$tag" ]]; then
            echo "No published release in ${RELEASE_REPOSITORY}"
          elif [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Refusing ${tag}: the fork channel publishes only -alpha.N, -beta.N and -rc.N tags" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "allow_downgrade=${allow_downgrade}" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/checksums.txt" \
            --output "${RUNNER_TEMP}/checksums.txt"

      # The cask may not exist yet, so "absent" stands in for its blob.
      - name: Write the cask
        id: cask
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALLOW_DOWNGRADE: ${{ steps.release.outputs.allow_downgrade }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:Casks/olk.rb 2>/dev/null; then
            base="$(git rev-parse HEAD:Casks/olk.rb)"
          else
            base=absent
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          mkdir -p Casks
          ruby scripts/update-olk-cask.rb \
            "$TAG" "$RELEASE_REPOSITORY" "${RUNNER_TEMP}/checksums.txt" Casks/olk.rb
          ruby -c Casks/olk.rb
          if [[ -z "$(git status --porcelain -- Casks/olk.rb)" ]]; then
            echo "Cask already publishes ${TAG}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the candidate cask
        if: steps.cask.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olk-cask
          path: Casks/olk.rb
          retention-days: 1

  test:
    name: Install on ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - name: Download candidate cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: olk-cask
          path: ${{ runner.temp }}/candidate

      # Homebrew installs casks only from a tap, so the candidate goes into a
      # throwaway local one. Running `olk version` touches no Microsoft account
      # and proves the quarantine flag was removed.
      - name: Install and run
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new --no-git aberoham/candidate
          tap_dir="$(brew --repository aberoham/candidate)"
          mkdir -p "${tap_dir}/Casks"
          cp "${RUNNER_TEMP}/candidate/olk.rb" "${tap_dir}/Casks/olk.rb"
          # Runner images carry different Homebrew releases; those with tap
          # trust may refuse an untrusted tap, and older ones lack the command.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap aberoham/candidate
          fi
          brew install --cask aberoham/candidate/olk
          output="$("$(brew --prefix)/bin/olk" version)"
          echo "$output"
          if [[ "$output" != "olk ${TAG#v} ("* ]]; then
            echo "olk version does not report ${TAG#v}" >&2
            exit 1
          fi
          "$(brew --prefix)/bin/olk" --help >/dev/null

  publish:
    name: Publish cask
    needs: [prepare, test]
    # A run dispatched from another branch may prepare and test, but only a
    # run of main's own workflow may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it

      # The candidate replaces the whole file, so publishing it over a cask
      # that changed after preparation would silently discard that change.
      - name: Check main's cask is the one the candidate was built from
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:Casks/olk.rb 2>/dev/null; then
            current="$(git rev-parse HEAD:Casks/olk.rb)"
          else
            current=absent
          fi
          if [[ "$current" != "$BASE" ]]; then
            echo "Casks/olk.rb on main changed after this run prepared its candidate." >&2
            echo "Re-run the workflow to build the candidate from the current cask." >&2
            exit 1
          fi

      - name: Download candidate cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: olk-cask
          path: Casks

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- Casks/olk.rb)" ]]; then
            echo "Cask already publishes ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/olk.rb
          git commit -m "Update olk to ${TAG}"
          git push origin HEAD:main
