name: Teams CLI formula

# Prepares, tests and publishes one channel of the teams formula. Called by
# update-teams-formula.yml (stable: teams-cli, from upstream-vX.Y.Z releases)
# and update-teams-next-formula.yml (next: teams-cli-next, from the fork's
# vX.Y.Z-alpha.N prereleases). Both read the fork's public releases and commit
# with the tap's own token, so no other repository holds a credential that can
# write here.
on:
  workflow_call:
    inputs:
      channel:
        description: stable or next
        type: string
        required: true
      tag:
        description: Release tag to publish (default is the channel's newest release)
        type: string
        required: false
        default: ""

permissions: {}

env:
  RELEASE_REPOSITORY: aberoham/ms-teams-cli
  CHANNEL: ${{ inputs.channel }}
  FORMULA: ${{ inputs.channel == 'stable' && 'teams-cli' || 'teams-cli-next' }}

jobs:
  prepare:
    name: Prepare formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # verify a mirrored release's source manifest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_tag: ${{ steps.release.outputs.version_tag }}
      attestation: ${{ steps.release.outputs.attestation }}
      changed: ${{ steps.formula.outputs.changed }}
      base: ${{ steps.formula.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Test the updater
        run: |
          ruby test/teams_channel_test.rb
          ruby test/update_teams_formula_test.rb

      # A named tag may move the formula to any release of its channel, which
      # is how a bad release is rolled back. The unattended default only moves
      # up, and considers only the channel's own tags: the fork publishes both
      # channels, so its newest release overall may belong to the other one.
      # scripts/teams_channel.rb holds each channel's tag rule. The default is
      # the channel's highest version among all published releases, read in
      # full, so the other channel's releases and listing order do not matter.
      - name: Choose release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            allow_downgrade=true
          else
            tag="$(gh api --paginate "repos/${RELEASE_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | .tag_name' |
              ruby scripts/teams_channel.rb newest "$CHANNEL")"
            allow_downgrade=false
          fi
          if [[ -z "$tag" ]]; then
            echo "No published ${CHANNEL} release in ${RELEASE_REPOSITORY}"
            version_tag=""
            attestation=""
          else
            version_tag="$(ruby scripts/teams_channel.rb version-tag "$CHANNEL" "$tag")"
            attestation="$(ruby scripts/teams_channel.rb attested "$CHANNEL" "$tag")"
          fi
          {
            echo "tag=${tag}"
            echo "version_tag=${version_tag}"
            echo "attestation=${attestation}"
            echo "allow_downgrade=${allow_downgrade}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/checksums-sha256.txt" \
            --output "${RUNNER_TEMP}/checksums-sha256.txt"

      # A mirrored release's attestation names the fork's workflow, not the
      # source it built. Its source manifest names that source, and must name
      # upstream's commit for the same tag. The fork attests every file of a
      # release in one signed statement, so the statement that covers the
      # manifest must also cover each archive at exactly the checksum the
      # formula will pin; a manifest from another run cannot vouch for them.
      - name: Check the mirrored source
        if: steps.release.outputs.tag != '' && env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/teams-${VERSION_TAG}-source.txt"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/teams-${VERSION_TAG}-source.txt" \
            --output "$manifest"
          cat "$manifest"
          verified="$(gh attestation verify "$manifest" --repo "$RELEASE_REPOSITORY" \
            --signer-workflow "${RELEASE_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref refs/heads/next --format json)"

          field() { sed -n "s/^$1=//p" "$manifest"; }
          expected="$(gh api "repos/osodevops/ms-teams-cli/commits/${VERSION_TAG}" --jq .sha)"
          if [[ "$(field source_repository)" != osodevops/ms-teams-cli \
            || "$(field source_tag)" != "$VERSION_TAG" \
            || "$(field source_commit)" != "$expected" ]]; then
            echo "${TAG} was not built from osodevops/ms-teams-cli ${VERSION_TAG} (${expected})" >&2
            exit 1
          fi

          # "<sha256> <name>" for the four archives the formula installs.
          wanted="$(grep -E " teams-${VERSION_TAG//./\\.}-[a-z0-9_-]+\.tar\.gz$" \
            "${RUNNER_TEMP}/checksums-sha256.txt" | awk '{print $1 " " $2}' | sort)"
          if [[ "$(wc -l <<<"$wanted")" -ne 4 ]]; then
            echo "checksums-sha256.txt does not list the four archives for ${VERSION_TAG}" >&2
            exit 1
          fi
          bound="$(jq -r --arg wanted "$wanted" '
            [.[].verificationResult.statement.subject
             | [.[] | "\(.digest.sha256) \(.name)"]
             | select(($wanted | split("\n")) - . == [])]
            | length' <<<"$verified")"
          if [[ "$bound" -lt 1 ]]; then
            echo "No attestation of ${TAG}'s source manifest also covers its archives at these checksums" >&2
            exit 1
          fi
          echo "The source manifest and the four archives are attested together."

      - name: Update formula URLs and checksums
        id: formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALLOW_DOWNGRADE: ${{ steps.release.outputs.allow_downgrade }}
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse "HEAD:Formula/${FORMULA}.rb")" >> "$GITHUB_OUTPUT"
          ruby scripts/update-teams-formula.rb \
            "$CHANNEL" "$TAG" "$RELEASE_REPOSITORY" "${RUNNER_TEMP}/checksums-sha256.txt" \
            "Formula/${FORMULA}.rb"
          ruby -c "Formula/${FORMULA}.rb"
          git diff --check
          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "Formula already publishes ${TAG}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the candidate formula
        if: steps.formula.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.FORMULA }}-formula
          path: Formula/${{ env.FORMULA }}.rb
          retention-days: 1

  test:
    name: Install on ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read # verify the archive's build provenance
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.FORMULA }}-formula
          path: ${{ runner.temp }}/candidate

      # Homebrew installs formulae only from a tap, so the candidate goes into
      # a throwaway local one. The test block runs --version and --help and
      # touches no Microsoft account.
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          ATTESTATION: ${{ needs.prepare.outputs.attestation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new --no-git aberoham/candidate
          cp "${RUNNER_TEMP}/candidate/${FORMULA}.rb" \
            "$(brew --repository aberoham/candidate)/Formula/${FORMULA}.rb"
          # Runner images carry different Homebrew releases; those with tap
          # trust may refuse an untrusted tap, and older ones lack the command.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap aberoham/candidate
          fi
          brew install --formula "aberoham/candidate/${FORMULA}"

          # Every mirrored release, and every fork prerelease from
          # 0.8.1-alpha.1, carries a build provenance attestation from the
          # fork's release workflow (scripts/teams_channel.rb). Older fork
          # prereleases stay installable for rollbacks. A mirror runs from
          # next; a prerelease from its own tag.
          if [[ "$ATTESTATION" == required ]]; then
            if [[ "$CHANNEL" == stable ]]; then
              source_ref=refs/heads/next
            else
              source_ref="refs/tags/${TAG}"
            fi
            archive="$(brew --cache --formula "aberoham/candidate/${FORMULA}")"
            gh attestation verify "$archive" --repo "$RELEASE_REPOSITORY" \
              --signer-workflow "${RELEASE_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "$source_ref"
          else
            echo "${TAG} predates attestations; not checking provenance."
          fi

          if [[ "$RUNNER_OS" == macOS ]]; then
            ruby scripts/verify-macos-release.rb teams "$VERSION_TAG" "$(brew --prefix)/bin/teams"
          fi
          brew test "aberoham/candidate/${FORMULA}"
          output="$("$(brew --prefix)/bin/teams" --version)"
          echo "$output"
          if [[ "$output" != "teams ${VERSION_TAG#v}" ]]; then
            echo "teams --version does not report ${VERSION_TAG#v}" >&2
            exit 1
          fi

  publish:
    name: Publish formula
    needs: [prepare, test]
    # A run dispatched from another branch may prepare and test, but only a
    # run of main's own workflow may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Both channels push to main; one at a time keeps either from losing the
    # race to the other's push.
    concurrency:
      group: publish-teams-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it

      # The candidate replaces the whole file, so publishing it over a formula
      # that changed after preparation would silently discard that change.
      - name: Check main's formula is the one the candidate was built from
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse "HEAD:Formula/${FORMULA}.rb")"
          if [[ "$current" != "$BASE" ]]; then
            echo "Formula/${FORMULA}.rb on main changed after this run prepared its candidate." >&2
            echo "Re-run the workflow to build the candidate from the current formula." >&2
            exit 1
          fi

      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.FORMULA }}-formula
          path: Formula

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "Formula already publishes ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git commit -m "Update ${FORMULA} to ${TAG}"
          git push origin HEAD:main
