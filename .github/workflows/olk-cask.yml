name: olk cask

# Prepares, tests and publishes one channel of the olk cask. Called by
# update-olk-cask.yml (stable: olk, from upstream-vX.Y.Z releases) and
# update-olk-next-cask.yml (next: olk-next, from the fork's vX.Y.Z-alpha.N
# prereleases). Both read the fork's public releases and commit with the tap's
# own token, so no other repository holds a credential that can write here.
on:
  workflow_call:
    inputs:
      channel:
        description: stable or next
        type: string
        required: true
      tag:
        description: Release tag to publish (default is the channel's newest release)
        type: string
        required: false
        default: ""

permissions: {}

env:
  RELEASE_REPOSITORY: aberoham/olkcli
  CHANNEL: ${{ inputs.channel }}
  CASK: ${{ inputs.channel == 'stable' && 'olk' || 'olk-next' }}

jobs:
  prepare:
    name: Prepare cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # verify a mirrored release's source manifest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_tag: ${{ steps.release.outputs.version_tag }}
      attestation: ${{ steps.release.outputs.attestation }}
      changed: ${{ steps.cask.outputs.changed }}
      base: ${{ steps.cask.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Test the updater
        run: |
          ruby test/olk_channel_test.rb
          ruby test/update_olk_cask_test.rb

      # A named tag may move the cask to any release of its channel, which is
      # how a bad release is rolled back. The unattended default only moves
      # up, and takes the channel's highest version among all published
      # releases, so the other channel's releases and listing order do not
      # matter.
      - name: Choose release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            allow_downgrade=true
          else
            tag="$(gh api --paginate "repos/${RELEASE_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | .tag_name' |
              ruby scripts/olk_channel.rb newest "$CHANNEL")"
            allow_downgrade=false
          fi
          if [[ -z "$tag" ]]; then
            echo "No published ${CHANNEL} release in ${RELEASE_REPOSITORY}"
            version_tag=""
            attestation=""
          else
            version_tag="$(ruby scripts/olk_channel.rb version-tag "$CHANNEL" "$tag")"
            attestation="$(ruby scripts/olk_channel.rb attested "$CHANNEL" "$tag")"
          fi
          {
            echo "tag=${tag}"
            echo "version_tag=${version_tag}"
            echo "attestation=${attestation}"
            echo "allow_downgrade=${allow_downgrade}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/checksums.txt" \
            --output "${RUNNER_TEMP}/checksums.txt"

      # A mirrored release's attestation names the fork's workflow, not the
      # source it built. Its source manifest names that source, and must name
      # upstream's commit for the same tag. The fork attests every file of a
      # release in one signed statement, so the statement that covers the
      # manifest must also cover both macOS archives at exactly the checksums
      # the cask will pin; a manifest from another run cannot vouch for them.
      - name: Check the mirrored source
        if: steps.release.outputs.tag != '' && env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION_TAG#v}"
          manifest="${RUNNER_TEMP}/olk_${version}_source.txt"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/olk_${version}_source.txt" \
            --output "$manifest"
          cat "$manifest"
          verified="$(gh attestation verify "$manifest" --repo "$RELEASE_REPOSITORY" \
            --signer-workflow "${RELEASE_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref refs/heads/next --format json)"

          field() { sed -n "s/^$1=//p" "$manifest"; }
          expected="$(gh api "repos/rlrghb/olkcli/commits/${VERSION_TAG}" --jq .sha)"
          if [[ "$(field source_repository)" != rlrghb/olkcli \
            || "$(field source_tag)" != "$VERSION_TAG" \
            || "$(field source_commit)" != "$expected" ]]; then
            echo "${TAG} was not built from rlrghb/olkcli ${VERSION_TAG} (${expected})" >&2
            exit 1
          fi

          # "<sha256> <name>" for the two archives the cask installs.
          wanted="$(grep -E " olk_${version//./\\.}_darwin_(amd64|arm64)\.tar\.gz$" \
            "${RUNNER_TEMP}/checksums.txt" | awk '{print $1 " " $2}' | sort)"
          if [[ "$(wc -l <<<"$wanted")" -ne 2 ]]; then
            echo "checksums.txt does not list the two macOS archives for ${VERSION_TAG}" >&2
            exit 1
          fi
          bound="$(jq -r --arg wanted "$wanted" '
            [.[].verificationResult.statement.subject
             | [.[] | "\(.digest.sha256) \(.name)"]
             | select(($wanted | split("\n")) - . == [])]
            | length' <<<"$verified")"
          if [[ "$bound" -lt 1 ]]; then
            echo "No attestation of ${TAG}'s source manifest also covers its archives at these checksums" >&2
            exit 1
          fi
          echo "The source manifest and the macOS archives are attested together."

      # The cask may not exist yet, so "absent" stands in for its blob.
      - name: Write the cask
        id: cask
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALLOW_DOWNGRADE: ${{ steps.release.outputs.allow_downgrade }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "HEAD:Casks/${CASK}.rb" 2>/dev/null; then
            base="$(git rev-parse "HEAD:Casks/${CASK}.rb")"
          else
            base=absent
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          mkdir -p Casks
          ruby scripts/update-olk-cask.rb \
            "$CHANNEL" "$TAG" "$RELEASE_REPOSITORY" "${RUNNER_TEMP}/checksums.txt" "Casks/${CASK}.rb"
          ruby -c "Casks/${CASK}.rb"
          if [[ -z "$(git status --porcelain -- "Casks/${CASK}.rb")" ]]; then
            echo "Cask already publishes ${TAG}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the candidate cask
        if: steps.cask.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CASK }}-cask
          path: Casks/${{ env.CASK }}.rb
          retention-days: 1

  test:
    name: Install on ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read # verify the archive's build provenance
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download candidate cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CASK }}-cask
          path: ${{ runner.temp }}/candidate

      # Homebrew installs casks only from a tap, so the candidate goes into a
      # throwaway local one. Running `olk version` touches no Microsoft account
      # and checks the installed version after signature verification.
      - name: Install and run
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          ATTESTATION: ${{ needs.prepare.outputs.attestation }}
        shell: bash
        run: |
          set -euo pipefail
          brew tap-new --no-git aberoham/candidate
          tap_dir="$(brew --repository aberoham/candidate)"
          mkdir -p "${tap_dir}/Casks"
          cp "${RUNNER_TEMP}/candidate/${CASK}.rb" "${tap_dir}/Casks/${CASK}.rb"
          # Runner images carry different Homebrew releases; those with tap
          # trust may refuse an untrusted tap, and older ones lack the command.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap aberoham/candidate
          fi
          brew install --cask "aberoham/candidate/${CASK}"

          # Every mirrored release, and every fork prerelease from
          # 1.16.2-alpha.1, carries a build provenance attestation from the
          # fork's release workflow (scripts/olk_channel.rb). Older fork
          # prereleases stay installable for rollbacks. A mirror runs from
          # next; a prerelease from its own tag.
          if [[ "$ATTESTATION" == required ]]; then
            if [[ "$CHANNEL" == stable ]]; then
              source_ref=refs/heads/next
            else
              source_ref="refs/tags/${TAG}"
            fi
            archive="$(brew --cache --cask "aberoham/candidate/${CASK}")"
            gh attestation verify "$archive" --repo "$RELEASE_REPOSITORY" \
              --signer-workflow "${RELEASE_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "$source_ref"
          else
            echo "${TAG} predates attestations; not checking provenance."
          fi

          ruby scripts/verify-macos-release.rb olk "$VERSION_TAG" "$(brew --prefix)/bin/olk"
          output="$("$(brew --prefix)/bin/olk" version)"
          echo "$output"
          if [[ "$output" != "olk ${VERSION_TAG#v} ("* ]]; then
            echo "olk version does not report ${VERSION_TAG#v}" >&2
            exit 1
          fi
          "$(brew --prefix)/bin/olk" --help >/dev/null

  publish:
    name: Publish cask
    needs: [prepare, test]
    # A run dispatched from another branch may prepare and test, but only a
    # run of main's own workflow may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Both channels push to main; one at a time keeps either from losing the
    # race to the other's push.
    concurrency:
      group: publish-olk-cask
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it

      # The candidate replaces the whole file, so publishing it over a cask
      # that changed after preparation would silently discard that change.
      - name: Check main's cask is the one the candidate was built from
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "HEAD:Casks/${CASK}.rb" 2>/dev/null; then
            current="$(git rev-parse "HEAD:Casks/${CASK}.rb")"
          else
            current=absent
          fi
          if [[ "$current" != "$BASE" ]]; then
            echo "Casks/${CASK}.rb on main changed after this run prepared its candidate." >&2
            echo "Re-run the workflow to build the candidate from the current cask." >&2
            exit 1
          fi

      - name: Download candidate cask
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CASK }}-cask
          path: Casks

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- "Casks/${CASK}.rb")" ]]; then
            echo "Cask already publishes ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          git commit -m "Update ${CASK} to ${TAG}"
          git push origin HEAD:main
