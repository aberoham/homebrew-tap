name: Update Teams CLI Formula
run-name: Update teams-cli ${{ inputs.tag || 'to the newest mirrored upstream release' }}

# teams-cli: upstream's stable releases, built, signed and attested by the
# fork and published there as upstream-vX.Y.Z.
on:
  schedule:
    # 09:17 UTC, Monday to Friday, half an hour after the fork's mirror run.
    - cron: "17 9 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Mirrored release tag to publish, upstream-vX.Y.Z (default is the newest)
        required: false
        type: string

permissions: {}

concurrency:
  group: update-teams-cli-formula
  cancel-in-progress: false

jobs:
  formula:
    name: teams-cli
    permissions:
      contents: write # publish the formula to main
      attestations: read # verify the archive's build provenance
    uses: ./.github/workflows/teams-formula.yml
    with:
      channel: stable
      tag: ${{ inputs.tag }}
