name: Update Teams CLI Formula
run-name: Update teams-cli ${{ inputs.tag || 'to the newest fork release' }}

# The tap reads the fork's public releases and commits with its own token, so
# no other repository holds a credential that can write here.
on:
  schedule:
    # 09:17 UTC, Monday to Friday. Run the workflow by hand to publish sooner.
    - cron: "17 9 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Fork prerelease tag to publish (default is the newest release)
        required: false
        type: string

permissions: {}

concurrency:
  group: update-teams-cli-formula
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: aberoham/ms-teams-cli

jobs:
  prepare:
    name: Prepare formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.formula.outputs.changed }}
      base: ${{ steps.formula.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Test the updater
        run: ruby test/update_teams_formula_test.rb

      # A named tag may move the formula to any fork prerelease, which is how
      # a bad release is rolled back. The unattended default only moves up.
      - name: Choose release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            allow_downgrade=true
          else
            tag="$(gh release list --repo "$RELEASE_REPOSITORY" --exclude-drafts \
              --limit 1 --json tagName --jq '.[0].tagName // ""')"
            allow_downgrade=false
          fi
          if [[ -z "$tag" ]]; then
            echo "No published release in ${RELEASE_REPOSITORY}"
          elif [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Refusing ${tag}: the fork channel publishes only -alpha.N, -beta.N and -rc.N tags" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "allow_downgrade=${allow_downgrade}" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}/checksums-sha256.txt" \
            --output "${RUNNER_TEMP}/checksums-sha256.txt"

      - name: Update formula URLs and checksums
        id: formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALLOW_DOWNGRADE: ${{ steps.release.outputs.allow_downgrade }}
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD:Formula/teams-cli.rb)" >> "$GITHUB_OUTPUT"
          ruby scripts/update-teams-formula.rb \
            "$TAG" "$RELEASE_REPOSITORY" "${RUNNER_TEMP}/checksums-sha256.txt" \
            Formula/teams-cli.rb
          ruby -c Formula/teams-cli.rb
          git diff --check
          if git diff --quiet -- Formula/teams-cli.rb; then
            echo "Formula already publishes ${TAG}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the candidate formula
        if: steps.formula.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teams-cli-formula
          path: Formula/teams-cli.rb
          retention-days: 1

  test:
    name: Install on ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-cli-formula
          path: ${{ runner.temp }}/candidate

      # Homebrew installs formulae only from a tap, so the candidate goes into
      # a throwaway local one. The test block runs --version and --help and
      # touches no Microsoft account.
      - name: Install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new --no-git aberoham/candidate
          cp "${RUNNER_TEMP}/candidate/teams-cli.rb" \
            "$(brew --repository aberoham/candidate)/Formula/teams-cli.rb"
          # Runner images carry different Homebrew releases; those with tap
          # trust may refuse an untrusted tap, and older ones lack the command.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap aberoham/candidate
          fi
          brew install --formula aberoham/candidate/teams-cli
          brew test aberoham/candidate/teams-cli
          output="$("$(brew --prefix)/bin/teams" --version)"
          echo "$output"
          if [[ "$output" != "teams ${TAG#v}" ]]; then
            echo "teams --version does not report ${TAG#v}" >&2
            exit 1
          fi

  publish:
    name: Publish formula
    needs: [prepare, test]
    # A run dispatched from another branch may prepare and test, but only a
    # run of main's own workflow may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it

      # The candidate replaces the whole file, so publishing it over a formula
      # that changed after preparation would silently discard that change.
      - name: Check main's formula is the one the candidate was built from
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD:Formula/teams-cli.rb)"
          if [[ "$current" != "$BASE" ]]; then
            echo "Formula/teams-cli.rb on main changed after this run prepared its candidate." >&2
            echo "Re-run the workflow to build the candidate from the current formula." >&2
            exit 1
          fi

      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-cli-formula
          path: Formula

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/teams-cli.rb; then
            echo "Formula already publishes ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/teams-cli.rb
          git commit -m "Update teams-cli to ${TAG}"
          git push origin HEAD:main
